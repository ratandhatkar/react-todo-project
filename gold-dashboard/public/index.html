<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Gold Tracker</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#1d1a14;--mute:#7a7366;--line:#ece6d8;--gold:#b8860b;--silver:#6b7a8a;--up:#12805c;--down:#c0392b;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b15;--ink:#f3ede0;--mute:#9a9282;--line:#2e2a21;--gold:#e0b34a;--silver:#9fb0c2;--up:#3ecf9a;--down:#ff6b5b;--warn:#f0a63a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:20px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.live{font-size:13px;color:var(--mute)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--down);margin-right:6px}.dot.on{background:var(--up);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{font-size:12px;color:var(--mute)}.big{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}.sub{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
svg.spark{width:100%;height:46px;margin-top:6px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}tr:last-child td{border-bottom:0}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.badge.live{color:var(--up);border-color:var(--up)}.badge.stale,.badge.manual,.badge.mock{color:var(--warn);border-color:var(--warn)}
.flash-up{animation:fu 1.6s}.flash-down{animation:fd 1.6s}
@keyframes fu{from{background:color-mix(in srgb,var(--up) 30%,transparent)}}@keyframes fd{from{background:color-mix(in srgb,var(--down) 30%,transparent)}}
.note{font-size:12px;color:var(--mute);margin-top:10px}.na{color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:6px}.ctl button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}.ctl button.on{background:var(--gold);color:#fff;border-color:var(--gold)}.ctl .sep{width:12px}
.tip{position:absolute;pointer-events:none;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px #0002;white-space:nowrap;transform:translate(-50%,-100%)}
#banner{display:none;background:var(--warn);color:#000;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
</style>
</head>
<body><main>
<header><h1>🪙 India Gold &amp; Silver Tracker</h1><div class="live"><span id="dot" class="dot"></span><span id="status">connecting…</span></div></header>
<div id="banner"></div>
<h2>Market (international spot → INR)</h2>
<div class="grid" id="spot"></div>
<h2>History · daily</h2>
<div class="card" id="hist">
 <div class="ctl" id="ctl"></div>
 <div id="stats" class="sub" style="margin:8px 0"></div>
 <div id="chartwrap" style="position:relative"><svg id="chart" viewBox="0 0 900 300" preserveAspectRatio="none" style="width:100%;height:280px"></svg><div id="tip" class="tip"></div></div>
 <div id="legend" class="sub"></div>
 <div class="note" id="hnote"></div>
</div>
<h2>Jewellers · INR per gram</h2>
<div class="tw"><table><thead><tr><th>Seller</th><th>24K</th><th>22K</th><th>18K</th><th>Silver</th><th>vs parity (24K)</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="note" id="note"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const inr=n=>n==null?'—':'₹'+Math.round(n).toLocaleString('en-IN');
const inr2=n=>n==null?'—':'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=n=>n==null?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ago=iso=>{if(!iso)return 'unknown';const s=(Date.now()-new Date(iso))/1000;return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const chg=(a,b,f)=>{if(a==null||b==null)return '';const d=a-b,p=b?d/b*100:0;return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${f(Math.abs(d))} (${p.toFixed(2)}%)</span>`};
function spark(h,color){if(!h||h.length<2)return '';const v=h.map(x=>x.v),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
 const pts=v.map((y,i)=>`${(i/(v.length-1)*300).toFixed(1)},${(42-(y-mn)/r*38).toFixed(1)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 300 44" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const base={};let prev={};
function flash(key,val){const p=prev[key];prev[key]=val;return p==null||p===val?'':(val>p?'flash-up':'flash-down')}
function render(d){
 $('dot').className='dot on';$('status').textContent='live · '+new Date(d.serverTime).toLocaleTimeString('en-IN');
 const e=d.spot.error;$('banner').style.display=e&&!d.spot.gold?'block':'none';$('banner').textContent='Spot feed error: '+e;
 const s=d.spot,p=d.parity;
 let spotHtml='';
 if(s.gold){base.g??=p.gold24Raw;base.s??=p.silverRaw;
  spotHtml+=`
  <div class="card"><div class="lbl">Gold spot (XAU/USD)</div><div class="big ${flash('xau',s.gold.usdOz)}">${usd(s.gold.usdOz)}</div><div class="sub">per oz · ${chg(s.gold.usdOz,s.gold.prevUsdOz,usd)}</div></div>
  <div class="card"><div class="lbl">Gold 24K parity, India</div><div class="big ${flash('gp',p.gold24Landed)}">${inr(p.gold24Landed)}<span class="sub">/g</span></div><div class="sub">spot ${inr(p.gold24Raw)} + ${(p.importDuty*100).toFixed(0)}% duty · ${chg(p.gold24Raw,base.g,inr2)} since open</div>${spark(d.history.gold,'var(--gold)')}</div>
  <div class="card"><div class="lbl">Silver spot (XAG/USD)</div><div class="big ${flash('xag',s.silver.usdOz)}">${usd(s.silver.usdOz)}</div><div class="sub">per oz · ${chg(s.silver.usdOz,s.silver.prevUsdOz,usd)}</div></div>
  <div class="card"><div class="lbl">Silver, India (pre-duty)</div><div class="big">${inr2(p.silverRaw)}<span class="sub">/g</span></div><div class="sub">USD/INR ${s.usdinr.toFixed(3)}</div>${spark(d.history.silver,'var(--silver)')}</div>`}
 const ref=d.reference||{},dia=ref.diamond,ti=ref.titanium;
 if(dia)spotHtml+=`<div class="card"><div class="lbl">${dia.name}<span class="badge ${dia.status}">ref.</span></div><div class="big ${flash('dia',dia.rates.carat)}">${inr(dia.rates.carat)}<span class="sub">/ct</span></div><div class="sub">manual reference · no public live feed · updated ${ago(dia.updatedAt)}</div></div>`;
 if(ti)spotHtml+=`<div class="card"><div class="lbl">${ti.name}<span class="badge ${ti.status}">ref.</span></div><div class="big ${flash('ti',ti.rates.kg)}">${inr(ti.rates.kg)}<span class="sub">/kg</span></div><div class="sub">manual reference · no public live feed · updated ${ago(ti.updatedAt)}</div></div>`;
 $('spot').innerHTML=spotHtml;
 const order=['goodreturns','tanishq','malabar','kalyan','joyalukkas','png'];
 const rs=[...d.retail].sort((a,b)=>(order.indexOf(a.id)+99)%99-(order.indexOf(b.id)+99)%99);
 $('rows').innerHTML=rs.map(r=>{const R=r.rates||{},has=R['24K']!=null;
  const cell=(k,id)=>{if(R[k]==null)return '<td class="na">—</td>';const f=flash(r.id+k,R[k]);return `<td class="${f}">${inr(R[k])}</td>`};
  const pr=r.premiumPct24,lab={live:'live',manual:'manual',stale:'stale',nofeed:'no feed',mock:'demo'}[r.status]||r.status;
  return `<tr><td>${r.name}<span class="badge ${r.status}" title="${r.error||''}">${lab}</span></td>${cell('24K')}${cell('22K')}${cell('18K')}${cell('silver')}
  <td class="${pr==null?'na':pr>=0?'up':'down'}">${pr==null?'—':(pr>=0?'+':'')+pr.toFixed(2)+'%'}</td><td class="na">${has?ago(r.updatedAt):'—'}</td></tr>`}).join('');
 $('note').textContent=(d.mock?'DEMO MODE: synthetic numbers. ':'')+'"vs parity" compares the seller’s 24K rate with spot × USD/INR × (1 + import duty); retail rates also include making/margin, and exclude 3% GST. "manual" rows come from manual-rates.json; "no feed" means the site could not be read automatically.'}
// ---------- history chart ----------
const OZ=31.1034768,COL=['var(--gold)','#2a7fd4','#c0392b','#12805c','#8e44ad','#e67e22','#7f8c8d'];
const METRICS={gold:{l:'Gold ₹/g',f:r=>r.xau/OZ*r.inr,fmt:inr2},silver:{l:'Silver ₹/g',f:r=>r.xag/OZ*r.inr,fmt:inr2},xau:{l:'Gold $/oz',f:r=>r.xau,fmt:usd},xag:{l:'Silver $/oz',f:r=>r.xag,fmt:usd},fx:{l:'USD/INR',f:r=>r.inr,fmt:v=>v.toFixed(3)},retail:{l:'Jeweller 24K ₹/g',fmt:inr}};
let hs={range:localStorage.hr||'1y',metric:localStorage.hm||'gold'},hrows=[],hseries=[];
function ctl(){const rg=['1m','3m','6m','1y','5y','max'];$('ctl').innerHTML=Object.entries(METRICS).map(([k,m])=>`<button data-m="${k}" class="${hs.metric===k?'on':''}">${m.l}</button>`).join('')+'<span class="sep"></span>'+rg.map(r=>`<button data-r="${r}" class="${hs.range===r?'on':''}">${r.toUpperCase()}</button>`).join('')}
$('ctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m)hs.metric=localStorage.hm=b.dataset.m;if(b.dataset.r){hs.range=localStorage.hr=b.dataset.r}ctl();loadHist(b.dataset.r!=null)};
async function loadHist(refetch=true){
 if(refetch||!hrows.length){try{const j=await (await fetch('/api/history?range='+hs.range)).json();hrows=j.rows;hs.mock=j.mock}catch{return}}
 const m=METRICS[hs.metric];
 if(hs.metric==='retail'){const ids={};hrows.forEach(r=>r.retail&&Object.keys(r.retail).forEach(i=>ids[i]=1));
  hseries=Object.keys(ids).map(id=>({name:id,pts:hrows.filter(r=>r.retail&&r.retail[id]).map(r=>({d:r.d,v:r.retail[id]['24K']}))}))}
 else hseries=[{name:m.l,pts:hrows.filter(r=>r.xau!=null).map(r=>({d:r.d,v:m.f(r)}))}];
 drawChart(m)}
function drawChart(m){
 const W=900,H=300,P={l:62,r:10,t:10,b:24},all=hseries.flatMap(s=>s.pts);
 if(Math.max(0,...hseries.map(x=>x.pts.length))<2){$('chart').innerHTML=`<text x="450" y="150" text-anchor="middle" fill="var(--mute)" font-size="14">${hs.metric==='retail'?'Jeweller history starts accumulating now: one point per day from the first run.':'No history yet'}</text>`;$('stats').textContent='';$('legend').textContent='';return}
 const ds=[...new Set(all.map(p=>p.d))].sort(),x0=Date.parse(ds[0]),x1=Date.parse(ds[ds.length-1])||x0+1;
 let mn=Math.min(...all.map(p=>p.v)),mx=Math.max(...all.map(p=>p.v));const pad=(mx-mn)*.06||1;mn-=pad;mx+=pad;
 const X=d=>P.l+(Date.parse(d)-x0)/((x1-x0)||1)*(W-P.l-P.r),Y=v=>P.t+(1-(v-mn)/(mx-mn))*(H-P.t-P.b);
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${m.fmt(v).replace(/\.\d+$/,'')}</text>`}
 for(let i=0;i<=4;i++){const t=x0+(x1-x0)*i/4,dd=new Date(t);g+=`<text x="${P.l+(W-P.l-P.r)*i/4}" y="${H-6}" text-anchor="${i==0?'start':i==4?'end':'middle'}" font-size="11" fill="var(--mute)">${dd.toLocaleDateString('en-IN',{month:'short',year:'2-digit',timeZone:'UTC'})}</text>`}
 g+=hseries.map((s,i)=>`<polyline points="${s.pts.map(p=>X(p.d).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${COL[i%COL.length]}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`).join('');
 g+='<line id="cur" y1="'+P.t+'" y2="'+(H-P.b)+'" stroke="var(--mute)" style="display:none"/>';
 $('chart').innerHTML=g;
 const s0=hseries[0].pts,a=s0[0],b=s0[s0.length-1],ch=b.v-a.v;
 $('stats').innerHTML=`${hseries.length==1?`${m.fmt(a.v)} → <b>${m.fmt(b.v)}</b> · <span class="${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${(ch/a.v*100).toFixed(1)}%</span> · `:''}low ${m.fmt(Math.min(...all.map(p=>p.v)))} · high ${m.fmt(Math.max(...all.map(p=>p.v)))} · ${hrows.length} days`;
 $('legend').innerHTML=hseries.length>1?hseries.map((s,i)=>`<span style="color:${COL[i%COL.length]}">●</span> ${s.name}`).join(' &nbsp; '):'';
 const live=hrows.filter(r=>r.src==='live').length;
 $('hnote').textContent=(hs.mock?'DEMO data. ':'')+'₹/g history = spot × USD/INR, before import duty/GST/making (duty changed over the period, so it is not a jeweller price). Rows up to the first run are COMEX futures daily closes (a close proxy for spot); '+live+' day(s) recorded live by this server.';
 const svg=$('chart'),tip=$('tip');
 svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,t=x0+(px-P.l)/(W-P.l-P.r)*(x1-x0);
  const idx=ds.reduce((bi,d,i)=>Math.abs(Date.parse(d)-t)<Math.abs(Date.parse(ds[bi])-t)?i:bi,0),d=ds[idx];
  const lines=hseries.map(s=>{const p=s.pts.find(p=>p.d===d);return p?`${hseries.length>1?s.name+': ':''}${m.fmt(p.v)}`:''}).filter(Boolean);
  const cx=X(d);$('cur').setAttribute('x1',cx);$('cur').setAttribute('x2',cx);$('cur').style.display='';
  tip.style.display='block';tip.style.left=Math.min(Math.max(cx/W*r.width,70),r.width-70)+'px';tip.style.top='40px';tip.innerHTML=`<b>${new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}</b><br>${lines.join('<br>')}`};
 svg.onmouseleave=()=>{tip.style.display='none';$('cur').style.display='none'}}
function connect(){const es=new EventSource('/api/stream');es.onmessage=m=>render(JSON.parse(m.data));
 es.onerror=()=>{$('dot').className='dot';$('status').textContent='reconnecting…'}}
ctl();loadHist();setInterval(()=>loadHist(true),600000);connect();
</script>
</body></html>
